<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube Downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <!-- 動画エリア -->
    <div id="video-area">
        <div class="video-title" id="title"></div>

        <div class="video-thumbnail-container">
            <img id="thumbnail" class="thumbnail" alt="Video thumbnail">
        </div>

        <div class="channel_container">
            <a href="#" id="channelLink">
                <img class="channel_avatar" id="channel_avatar" alt="Channel avatar">
                <span class="channel_name" id="channel_name"></span>
            </a>
        </div>

        <div class="video-info">
            <div class="video-info-item">
                <span class="video-info-label">Video ID:</span>
                <span class="video-info-value" id="id"></span>
            </div>
            <div class="video-info-item">
                <span class="video-info-label">Channel ID:</span>
                <span class="video-info-value" id="channel_id"></span>
            </div>
        </div>

        <button id="downloadButton">Download Video</button>
    </div>

    <!-- エラーエリア -->
    <div id="error-area" class="hide center">
        <span>⚠️ Download feature is only available on YouTube video pages.</span>
    </div>

    <!-- 履歴エリア -->
    <div id="history-area">
        <hr>
        <h1>Download History</h1>
        <button id="openHistoryButton">📋 Open Full History</button>
        <!-- 履歴アイテムがここに動的に追加されます -->
    </div>

    <script type="module" src="popup.js"></script>
</body>

</html>
